<html lang="tr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>Filtrasyon Simülasyonu</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0b3a6c;
      overflow: hidden;
    }

    .page {
      width: min(1090px, 100vw);
      margin: 0 auto;
      background: #0b3a6c;
    }

    .diagram {
      position: relative;
      width: 100%;
      aspect-ratio: 1090 / 586;
      overflow: hidden;
      background: #0b3a6c;
    }

    .base,
    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .base {
      user-select: none;
      pointer-events: none;
    }

    .overlay {
      pointer-events: none;
    }

    .title {
      fill: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 0;
      paint-order: stroke;
      stroke: rgba(0, 55, 120, .32);
      stroke-width: 2px;
    }

    .label {
      fill: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .01em;
      paint-order: stroke;
      stroke: rgba(0, 55, 120, .38);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }

    .leader {
      fill: none;
      stroke: #d8f4ff;
      stroke-width: 2.1;
      stroke-linecap: square;
      stroke-linejoin: round;
      opacity: .95;
    }

    .flow {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 16 76;
      animation: run 1.55s linear infinite;
    }

    .flow.dirty {
      stroke: #ffe66a;
      stroke-width: 8;
      opacity: .58;
    }

    .flow.clean {
      stroke: #aaf6ff;
      stroke-width: 7;
      opacity: .55;
      animation-duration: 1.35s;
    }

    .flow.white {
      stroke: #ffffff;
      stroke-width: 6;
      opacity: .48;
      animation-duration: 1.75s;
    }

    .flow.sludge {
      stroke: #b58a34;
      stroke-width: 8;
      opacity: .62;
      animation-duration: 1.9s;
    }

    .pump-ring {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3;
      opacity: .75;
      transform-box: fill-box;
      transform-origin: center;
      animation: pump 1.2s ease-out infinite;
    }

    .filter-line {
      stroke: #fff6a9;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .72;
      animation: blink .9s ease-in-out infinite alternate;
    }

    .gauge-hand {
      stroke: #ffffff;
      stroke-width: 2.3;
      stroke-linecap: round;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: swing 1.8s ease-in-out infinite alternate;
    }

    .valve {
      transform-box: fill-box;
      transform-origin: center;
      animation: valve 1.35s ease-in-out infinite alternate;
    }

    .particle {
      fill: #6d4d1f;
      opacity: .78;
      filter: drop-shadow(0 0 1px rgba(255,255,255,.55));
    }

    .particle.clean {
      fill: #9df5ff;
    }

    .particle.sludge {
      fill: #7a5722;
    }

    .bubble {
      fill: #bff8ff;
      opacity: .75;
      animation: bubble 1.9s ease-in infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .process-caption {
      height: 106px;
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 0 40px;
      color: #fff;
      background: #0b3a6c;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .process-caption .badge {
      flex: 0 0 auto;
      width: 150px;
    }

    .process-caption .group {
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
      font-weight: 600;
    }

    .process-caption .step {
      font-size: 34px;
      font-weight: 300;
      line-height: 1;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .process-caption .step small {
      font-size: 15px;
      opacity: .55;
    }

    .process-caption .text {
      flex: 1;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 400;
      max-width: 740px;
      text-wrap: pretty;
    }

    .process-caption .text b {
      font-weight: 700;
    }

    @keyframes run {
      to { stroke-dashoffset: -92; }
    }

    @keyframes pump {
      0% { opacity: .75; transform: scale(.78); }
      100% { opacity: 0; transform: scale(1.75); }
    }

    @keyframes blink {
      from { opacity: .25; }
      to { opacity: .9; }
    }

    @keyframes swing {
      from { transform: rotate(-28deg); }
      to { transform: rotate(32deg); }
    }

    @keyframes valve {
      from { transform: scale(.9) rotate(-8deg); opacity: .8; }
      to { transform: scale(1.08) rotate(8deg); opacity: 1; }
    }

    @keyframes bubble {
      0% { opacity: 0; transform: translateY(10px) scale(.65); }
      25% { opacity: .85; }
      100% { opacity: 0; transform: translateY(-38px) scale(1.05); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

  <script>
    (function(){
      const caption = document.querySelector('[data-caption]');
      const steps = JSON.parse(caption.dataset.steps);
      const step = caption.querySelector('.step');
      const text = caption.querySelector('.text');
      let index = 0;

      function render() {
        step.innerHTML = String(index + 1).padStart(2, '0') + '<small>/' + String(steps.length).padStart(2, '0') + '</small>';
        text.innerHTML = steps[index];
        index = (index + 1) % steps.length;
      }

      render();
      setInterval(render, 4600);
    })();
  </script>
