<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompakt Filtre (KF) — Çalışma Prensibi</title>
<style>
  :root{
    --blue-bg:#0c3a6b;
    --body:#e7eaed;
    --body2:#d4d9dd;
    --chamber:#eef1f3;
    --gold:#efb022;
    --gold-d:#d6970f;
    --cake:#8a7d33;
    --green:#2f8f5b;
    --green-d:#1f6e44;
    --drop:#46a6e2;
    --water:#2ba9e6;
    --water-lt:#9fd6f3;
    --exch:#2f9bd6;
    --sludge:#6b4f25;
    --sludge-lt:#7d5d2c;
    --pulley:#9aa1a7;
    --pulley-d:#5b636a;
    --line:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--blue-bg);overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #scaler{width:1200px;height:792px;transform-origin:center center;position:relative;}
  svg{display:block;}

  /* ---- caption band ---- */
  #caption{position:absolute;left:0;bottom:0;width:1200px;height:106px;
    display:flex;align-items:center;gap:26px;padding:0 40px;color:#fff;}
  #phaseBadge{flex:0 0 auto;width:150px;}
  #grpLabel{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.7;font-weight:600;}
  #stepNo{font-size:46px;font-weight:300;line-height:1;margin-top:4px;
    font-variant-numeric:tabular-nums;}
  #stepNo small{font-size:20px;opacity:.55;}
  #capText{flex:1;font-size:21px;line-height:1.4;font-weight:400;max-width:740px;
    text-wrap:pretty;}
  #capText b{font-weight:700;}

  /* progress dots */
  #dots{position:absolute;left:40px;top:32px;display:flex;gap:7px;align-items:center;}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);
    cursor:pointer;transition:.25s;}
  .dot.on{background:#ffd24a;transform:scale(1.25);}
  .dot.sep{width:1px;height:14px;border-radius:0;background:rgba(255,255,255,.3);
    cursor:default;margin:0 4px;}
  #dotTitle{margin-left:14px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600;}

  /* ---- focus ring ---- */
  #focusRing{fill:none;stroke:#ffd24a;stroke-width:3;opacity:0;
    transition:cx .5s ease,cy .5s ease,r .5s ease,opacity .4s ease;}
  #focusRing.on{opacity:.95;animation:ringPulse 1.7s ease-in-out infinite;}
  @keyframes ringPulse{0%,100%{stroke-opacity:.45;}50%{stroke-opacity:1;}}

  .hl{filter:drop-shadow(0 0 7px rgba(255,210,74,.95));}

  /* continuous flows */
  .dash-flow{stroke-dasharray:13 9;}
  @keyframes beltMove{to{stroke-dashoffset:-44;}}
  #beltExit,#beltEntry,#beltTrough{animation:beltMove .6s linear infinite;animation-play-state:paused;}
  .belt-fast #beltExit,.belt-fast #beltEntry,.belt-fast #beltTrough{animation-play-state:running;}

  @keyframes chevDown{0%{opacity:0;transform:translateY(-10px);}
    25%{opacity:1;}75%{opacity:1;}100%{opacity:0;transform:translateY(14px);}}
  .chev{animation:chevDown 1.6s linear infinite;}
  .chev2{animation-delay:.53s;}
  .chev3{animation-delay:1.06s;}

  @keyframes dropFall{0%{opacity:0;transform:translateY(0);}
    12%{opacity:1;}88%{opacity:1;}100%{opacity:0;transform:translateY(46px);}}
  .drop{animation:dropFall 1.5s linear infinite;}

  @keyframes pumpUp{0%{opacity:.15;transform:translateY(8px);}
    50%{opacity:1;transform:translateY(0);}100%{opacity:.15;transform:translateY(-8px);}}
  .pump-arrow{animation:pumpUp 1.9s ease-in-out infinite;}

  @keyframes circ{0%,100%{opacity:.3;}50%{opacity:1;}}
  .circ-arrow{animation:circ 2.2s ease-in-out infinite;}

  @keyframes spin{to{transform:rotate(360deg);}}
  #windSpiral{transform-origin:885px 356px;animation:spin 6s linear infinite;}

  @keyframes specFall{0%{opacity:0;transform:translateY(-6px);}
    20%{opacity:1;}80%{opacity:1;}100%{opacity:0;transform:translateY(30px);}}
  .spec{animation:specFall 2.4s linear infinite;}

  .lvl-trans{transition:y .9s ease,height .9s ease;}
  .soft{transition:opacity .5s ease,height .9s ease,y .9s ease;}

  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .lbl{font-size:15px;fill:#fff;font-weight:400;letter-spacing:.01em;}
  .lbl-sm{font-size:13px;fill:#fff;font-weight:400;letter-spacing:.01em;}
  .leader{stroke:#fff;stroke-width:1;fill:none;}
  .title-w{font-size:21px;fill:#fff;font-weight:300;}
</style>
</head>

<script>
(function(){
  "use strict";
  /* ---------------- phase definitions ---------------- */
  const PHASES = [
    // group 1 — filtration
    {g:"Filtrasyon süreci", n:1, focus:{x:524,y:230,r:48}, hl:"g-intake",

     st:{gold:312, cake:10, belt:"slow", sludge:26, wind:22, specks:true}},
    {g:"Filtrasyon süreci", n:3, focus:{x:500,y:412,r:60}, hl:"g-trough",
     t:"Kir parçacıkları, en küçük partikülleri bile ayıran bir <b>filtre keki</b> oluşturur.",
     st:{gold:312, cake:20, belt:"slow", sludge:26, wind:22, specks:true}},
    {g:"Filtrasyon süreci", n:4, focus:{x:400,y:500,r:120}, hl:"g-tank",
     t:"Temizlenen sıvı, <b>temiz tankta</b> toplanır.",
     st:{gold:312, cake:24, belt:"slow", sludge:26, wind:22, specks:true}},
    {g:"Filtrasyon süreci", n:5, focus:{x:320,y:400,r:70}, hl:"g-exch",
     t:"Alçak ve yüksek basınçlı <b>pompalar</b>, takım tezgâhına gerektiğinde temizlenmiş KSS sağlar.",
     st:{gold:312, cake:28, belt:"slow", sludge:26, wind:22, specks:true}},
    // group 2 — regeneration
    {g:"Filtre kayışı rejenerasyonu", n:1, focus:{x:500,y:412,r:60}, hl:"g-trough",
     t:"Büyüyen <b>filtre keki</b> akış direncini artırır.",
     st:{gold:308, cake:40, belt:"slow", sludge:26, wind:22, specks:true}},
    {g:"Filtre kayışı rejenerasyonu", n:2, focus:{x:500,y:330,r:70}, hl:"g-trough",
     t:"Filtre teknesindeki <b>sıvı seviyesi yükselir.</b>",
     st:{gold:286, cake:40, belt:"slow", sludge:26, wind:22, specks:true}},
    {g:"Filtre kayışı rejenerasyonu", n:3, focus:{x:626,y:292,r:42}, hl:"g-beltdrive",
     t:"<b>Kayış tahriki</b> belirli bir seviyede devreye girer (alternatif: zaman kontrollü).",
     st:{gold:286, cake:40, belt:"fast", sludge:26, wind:22, specks:false, arrow:true}},
    {g:"Filtre kayışı rejenerasyonu", n:4, focus:{x:500,y:360,r:96}, hl:"g-trough",
     t:"<b>Taşıyıcı kayış</b>, filtre yüzeyine bir parça temiz filtre keçesi taşır.",
     st:{gold:300, cake:6, belt:"fast", sludge:34, wind:30, specks:false, arrow:true}},
    {g:"Filtre kayışı rejenerasyonu", n:5, focus:{x:500,y:330,r:70}, hl:"g-trough",
     t:"<b>Sıvı seviyesi tekrar düşer.</b>",
     st:{gold:314, cake:8, belt:"slow", sludge:34, wind:30, specks:false}},
    {g:"Filtre kayışı rejenerasyonu", n:6, focus:{x:890,y:360,r:120}, hl:"g-winding",
     t:"<b>Çamur kabı</b> veya <b>sarma ünitesi</b> kirli filtre keçesini alır.",
     st:{gold:314, cake:8, belt:"slow", sludge:48, wind:40, specks:false}},
  ];
  const GROUP_TOTAL = {"Filtrasyon süreci":5, "Filtre kayışı rejenerasyonu":6};

  /* ---------------- elements ---------------- */
  const $ = s=>document.querySelector(s);
  const grpLabel=$("#grpLabel"), stepNo=$("#stepNo"), capText=$("#capText");
  const ring=$("#focusRing"), scaler=$("#scaler"), diagram=$("#diagram");
  const goldLiquid=$("#goldLiquid"), cakeLayer=$("#cakeLayer"), cakeSpecks=$("#cakeSpecks");
  const sludgeFill=$("#sludgeFill"), windSludge=$("#windSludge"), beltArrow=$("#beltArrow");
  const dots=$("#dots");
  const BOTTOM=430; // bowl bottom y for cake

  let idx=0, playing=true, timer=null;
  const DUR=4600;

  /* build dots */
  PHASES.forEach((p,i)=>{
    if(i===5){const s=document.createElement("div");s.className="dot sep";dots.appendChild(s);}
    const d=document.createElement("div"); d.className="dot"; d.dataset.i=i;
    d.addEventListener("click",()=>{go(i);});
    dots.appendChild(d);
  });
  const dotEls=[...dots.querySelectorAll(".dot:not(.sep)")];

  function applyState(s){
    // gold level
    goldLiquid.setAttribute("y", s.gold);
    goldLiquid.setAttribute("height", 442 - s.gold);
    // cake
    cakeLayer.setAttribute("y", BOTTOM - s.cake);
    cakeLayer.setAttribute("height", s.cake);
    cakeSpecks.style.transition="opacity .6s ease";
    cakeSpecks.setAttribute("opacity", s.specks ? 0.9 : 0);
    // sludge fills
    sludgeFill.setAttribute("y", 578 - s.sludge);
    sludgeFill.setAttribute("height", s.sludge);
    windSludge.setAttribute("y", 578 - s.wind);
    windSludge.setAttribute("height", s.wind);
    // belt speed
    diagram.classList.remove("belt-fast","belt-slow");
    diagram.classList.add(s.belt==="fast"?"belt-fast":"belt-slow");
    beltArrow.style.transition="opacity .4s ease";
    beltArrow.setAttribute("opacity", s.arrow?1:0);
  }

  function setHighlight(id){
    document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
    const el=document.getElementById(id);
    if(el) el.classList.add("hl");
  }

  function render(){
    const p=PHASES[idx];
    grpLabel.textContent=p.g;
    stepNo.innerHTML=String(p.n).padStart(2,"0")+"<small>/"+String(GROUP_TOTAL[p.g]).padStart(2,"0")+"</small>";
    capText.innerHTML=p.t;
    ring.classList.add("on");
    ring.setAttribute("cx",p.focus.x);
    ring.setAttribute("cy",p.focus.y);
    ring.setAttribute("r",p.focus.r);
    setHighlight(p.hl);
    applyState(p.st);
    dotEls.forEach((d,i)=>d.classList.toggle("on",i===idx));
  }

  function go(i){ idx=(i+PHASES.length)%PHASES.length; render(); resetTimer(); }
  function next(){ go(idx+1); }
  function prev(){ go(idx-1); }

  function resetTimer(){
    clearTimeout(timer);
    if(playing){ timer=setTimeout(()=>{ idx=(idx+1)%PHASES.length; render(); resetTimer(); }, DUR); }
  }
  function play(){ playing=true; resetTimer(); }

  /* ---------------- scaling ---------------- */
  function fit(){
    const s=Math.min(window.innerWidth/1200, window.innerHeight/792);
    scaler.style.transform="scale("+s+")";
  }
  window.addEventListener("resize",fit);

  fit(); render(); play();
})();
</script>
</body>
</html>
