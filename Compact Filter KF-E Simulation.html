  <title>Compact Filter KF-E Simulation</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0b3a6c;
      overflow: hidden;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .page {
      width: min(1062px, 100vw);
      margin: 0 auto;
      background: #0b3a6c;
    }

    .diagram {
      position: relative;
      width: 100%;
      aspect-ratio: 1062 / 584;
      overflow: hidden;
      background: #0b3a6c;
    }

    .base {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .belt-dash {
      fill: none;
      stroke: #2f8f5b;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 13;
      opacity: .95;
      filter: drop-shadow(0 0 1px rgba(255,255,255,.7));
      animation: belt 2.2s linear infinite;
    }

    .flow {
      stroke: #efb022;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .9;
      animation: pulse 1.05s ease-in-out infinite;
    }

    .pipe-glow {
      fill: none;
      stroke: #efb022;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 18 90;
      opacity: .9;
      animation: pipeRun 1.7s linear infinite;
    }

    .pipe-glow.blue {
      stroke: #46a6e2;
      stroke-width: 6;
      stroke-dasharray: 14 72;
      opacity: .9;
      animation-duration: 1.45s;
    }

    .blue-flow {
      stroke: #46a6e2;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .9;
      animation: pulse .95s ease-in-out infinite;
    }

    .drop {
      fill: #46a6e2;
      opacity: .95;
      animation: drip 1.55s ease-in infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .drop:nth-of-type(2) { animation-delay: .18s; }
    .drop:nth-of-type(3) { animation-delay: .33s; }
    .drop:nth-of-type(4) { animation-delay: .51s; }
    .drop:nth-of-type(5) { animation-delay: .71s; }
    .drop:nth-of-type(6) { animation-delay: .9s; }
    .drop:nth-of-type(7) { animation-delay: 1.08s; }

    .cake {
      fill: #6b4f25;
      opacity: .95;
      filter: drop-shadow(0 0 1px rgba(255,255,255,.35));
    }

    .spray {
      stroke: #cfe9fb;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: .95;
      animation: spray .75s ease-in-out infinite alternate;
    }

    .brush {
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: .95;
      transform-origin: 676px 304px;
      animation: spin 1s linear infinite;
    }

    .pump-ring {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3;
      opacity: .7;
      transform-box: fill-box;
      transform-origin: center;
      animation: pump 1.25s ease-out infinite;
    }

    .level-wave {
      fill: none;
      stroke: #efb022;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 16 18;
      opacity: .9;
      animation: wave 2.6s linear infinite;
    }

    .particle {
      fill: #5f5520;
      opacity: .95;
      filter: drop-shadow(0 0 1px rgba(255,255,255,.45));
    }

    .erase {
      fill: #0b3a6c;
    }

    .erase-line {
      fill: none;
      stroke: #0b3a6c;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .new-leader {
      fill: none;
      stroke: #fff;
      stroke-width: 1;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .new-label {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      fill: #fff;
      font-weight: 400;
      letter-spacing: .01em;
    }

    .process-caption {
      height: 106px;
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 0 40px;
      color: #fff;
      background: #0b3a6c;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .process-caption .badge {
      flex: 0 0 auto;
      width: 150px;
    }

    .process-caption .group {
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
      font-weight: 600;
    }

    .process-caption .step {
      font-size: 34px;
      font-weight: 300;
      line-height: 1;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .process-caption .step small {
      font-size: 15px;
      opacity: .55;
    }

    .process-caption .text {
      flex: 1;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 400;
      max-width: 740px;
      text-wrap: pretty;
    }

    .process-caption .text b {
      font-weight: 700;
    }

    @keyframes belt {
      to { stroke-dashoffset: -42; }
    }

    @keyframes pulse {
      50% { opacity: .22; }
    }

    @keyframes pipeRun {
      to { stroke-dashoffset: -108; }
    }

    @keyframes drip {
      0% { opacity: 0; transform: translateY(-12px) scale(.7); }
      25% { opacity: .9; }
      100% { opacity: 0; transform: translateY(46px) scale(1); }
    }

    @keyframes spray {
      from { opacity: .2; transform: translateX(-1px); }
      to { opacity: .8; transform: translateX(3px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pump {
      0% { opacity: .75; transform: scale(.82); }
      100% { opacity: 0; transform: scale(1.75); }
    }

    @keyframes wave {
      to { stroke-dashoffset: -68; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <script>
    (function(){
      const caption = document.querySelector('[data-caption]');
      const steps = JSON.parse(caption.dataset.steps);
      const step = caption.querySelector('.step');
      const text = caption.querySelector('.text');
      let index = 0;

      function render() {
        step.innerHTML = String(index + 1).padStart(2, '0') + '<small>/' + String(steps.length).padStart(2, '0') + '</small>';
        text.innerHTML = steps[index];
        index = (index + 1) % steps.length;
      }

      render();
      setInterval(render, 4600);
    })();
