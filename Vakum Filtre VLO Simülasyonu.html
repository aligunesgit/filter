<html lang="tr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vakum Filtre VLO Simülasyonu</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0b3a6c;
      overflow: hidden;
    }

    .page {
      width: min(1128px, 100vw);
      margin: 0 auto;
      background: #0b3a6c;
    }

    .diagram {
      position: relative;
      width: 100%;
      aspect-ratio: 1128 / 650;
      overflow: hidden;
      background: #0b3a6c;
    }

    .base,
    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .base {
      user-select: none;
      pointer-events: none;
    }

    .overlay {
      pointer-events: none;
    }

    .label {
      fill: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .01em;
      paint-order: stroke;
      stroke: rgba(0, 55, 120, .38);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }

    .leader {
      fill: none;
      stroke: #d8f4ff;
      stroke-width: 2.1;
      stroke-linecap: square;
      stroke-linejoin: round;
      opacity: .95;
    }

    .flow {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 16 78;
      animation: run 1.55s linear infinite;
    }

    .flow.dirty {
      stroke: #ffe465;
      stroke-width: 8;
      opacity: .58;
    }

    .flow.clean {
      stroke: #9ff4ff;
      stroke-width: 7;
      opacity: .55;
      animation-duration: 1.35s;
    }

    .flow.vacuum {
      stroke: #ffffff;
      stroke-width: 5;
      opacity: .5;
      stroke-dasharray: 9 48;
      animation-duration: 1.1s;
    }

    .flow.sludge {
      stroke: #bd8f2f;
      stroke-width: 7;
      opacity: .62;
      animation-duration: 1.85s;
    }

    .belt {
      fill: none;
      stroke: #fff173;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 14 20;
      opacity: .68;
      animation: run 1.75s linear infinite;
    }

    .spray {
      stroke: #eaffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: .65;
      animation: spray .7s ease-in-out infinite alternate;
    }

    .pump-ring {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3;
      opacity: .72;
      transform-box: fill-box;
      transform-origin: center;
      animation: pump 1.2s ease-out infinite;
    }

    .particle {
      fill: #7c5923;
      opacity: .78;
      filter: drop-shadow(0 0 1px rgba(255,255,255,.45));
    }

    .particle.clean {
      fill: #adf7ff;
    }

    .drop {
      fill: #58d8f5;
      opacity: .78;
      animation: drip 1.35s ease-in infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .process-caption {
      height: 106px;
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 0 40px;
      color: #fff;
      background: #0b3a6c;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .process-caption .badge {
      flex: 0 0 auto;
      width: 150px;
    }

    .process-caption .group {
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .7;
      font-weight: 600;
    }

    .process-caption .step {
      font-size: 34px;
      font-weight: 300;
      line-height: 1;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .process-caption .step small {
      font-size: 15px;
      opacity: .55;
    }

    .process-caption .text {
      flex: 1;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 400;
      max-width: 740px;
      text-wrap: pretty;
    }

    .process-caption .text b {
      font-weight: 700;
    }

    @keyframes run {
      to { stroke-dashoffset: -94; }
    }

    @keyframes spray {
      from { opacity: .2; transform: translateX(-2px); }
      to { opacity: .85; transform: translateX(3px); }
    }

    @keyframes pump {
      0% { opacity: .72; transform: scale(.8); }
      100% { opacity: 0; transform: scale(1.75); }
    }

    @keyframes drip {
      0% { opacity: 0; transform: translateY(-12px) scale(.7); }
      25% { opacity: .9; }
      100% { opacity: 0; transform: translateY(40px) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

  <script>
    (function(){
      const caption = document.querySelector('[data-caption]');
      const steps = JSON.parse(caption.dataset.steps);
      const step = caption.querySelector('.step');
      const text = caption.querySelector('.text');
      let index = 0;

      function render() {
        step.innerHTML = String(index + 1).padStart(2, '0') + '<small>/' + String(steps.length).padStart(2, '0') + '</small>';
        text.innerHTML = steps[index];
        index = (index + 1) % steps.length;
      }

      render();
      setInterval(render, 4600);
    })();
  </script>
